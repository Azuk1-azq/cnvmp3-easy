<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>cnvmp3 ボタン</title>
<style>
:root{--bg:#fff;--text:#0f0f0f;--text2:#606060;--chip:rgba(0,0,0,.05);--line:rgba(0,0,0,.1);--accent:#065fd4}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0f;--text:#f1f1f1;--text2:#aaa;--chip:rgba(255,255,255,.1);--line:rgba(255,255,255,.15);--accent:#3ea6ff}}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--text);font:400 14px/20px Roboto,"Noto Sans JP",system-ui,sans-serif}
h1{margin:0 0 2px;font-size:18px;line-height:28px;font-weight:700;display:flex;align-items:center;gap:8px}
h1 i{display:inline-block;width:28px;height:20px;border-radius:6px;background:#f00;position:relative}
h1 i::after{content:"";position:absolute;left:11px;top:5px;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
h2{margin:16px 0 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--text2);letter-spacing:.04em}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--text2);font-size:12px;line-height:16px;margin-top:2px}
select{height:32px;border:0;border-radius:8px;padding:0 8px;background:var(--chip);color:var(--text);font:500 13px Roboto,"Noto Sans JP",system-ui,sans-serif}
select option{background:var(--bg);color:var(--text)}
.sw{position:relative;flex:none;width:40px;height:24px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:12px;background:var(--text2);opacity:.6;transition:.15s}
.sw span::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:.15s}
.sw input:checked+span{background:var(--accent);opacity:1}
.sw input:checked+span::after{transform:translateX(16px);background:#fff}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border:0;border-radius:20px;background:var(--text);color:var(--bg);font:500 14px Roboto,"Noto Sans JP",system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.tonal{background:var(--chip);color:var(--text)}
.btn.tonal:hover{background:var(--line)}

body{width:360px}
.v{color:var(--text2);font-size:12px;margin-bottom:12px}
.coffee{margin-top:8px;height:36px;border-radius:18px}
.note{color:var(--text2);font-size:12px;line-height:16px;margin:0 0 2px}
.actions{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.actions .btn{height:36px;border-radius:18px}
.btn.danger{color:#d93025}
@media(prefers-color-scheme:dark){.btn.danger{color:#f28b82}}
.upd{margin:0 0 4px;padding:12px;border-radius:12px;background:var(--chip)}
.upd b{display:block;font-size:14px}
.upd small{display:block;color:var(--text2);font-size:12px;line-height:16px;margin:2px 0 10px}
.upd .btn{height:36px;border-radius:18px}
.btn.sm{height:32px;padding:0 14px;font-size:13px;flex:none}
.saved{height:16px;margin-top:8px;color:var(--text2);font-size:12px;text-align:center}
</style></head><body>
<h1><i></i>cnvmp3 ボタン</h1><div class="v" id="v"></div>

<div class="upd" id="updBox" hidden>
  <b id="updMsg"></b><small id="updSub"></small>
  <button type="button" class="btn" id="updRun" data-i18n="updRun"></button>
  <button type="button" class="btn tonal" id="updDl" data-i18n="updDownload" style="margin-top:8px"></button>
  <button type="button" class="btn tonal" id="updFolder" data-i18n="openFolder" style="margin-top:8px"></button>
</div>

<h2 data-i18n="secLang"></h2>
<div class="row"><div data-i18n="langLabel"></div>
  <select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></div>

<h2 data-i18n="secDefaults"></h2>
<div class="note" data-i18n="defaultNote"></div>
<div class="row"><div data-i18n="mp3q"></div><select id="q-mp3"></select></div>
<div class="row"><div data-i18n="mp4q"></div><select id="q-mp4"></select></div>

<h2 data-i18n="secDisplay"></h2>
<div class="row"><div><span data-i18n="showScreen"></span><small data-i18n="showScreenDesc"></small></div>
  <label class="sw"><input type="checkbox" id="showCnvScreen"><span></span></label></div>

<div class="row"><div><span data-i18n="tempMenu"></span><small data-i18n="tempMenuDesc"></small></div>
  <label class="sw"><input type="checkbox" id="tempMenu"><span></span></label></div>

<h2 data-i18n="secNotify"></h2>
<div class="row"><div data-i18n="sound"></div><label class="sw"><input type="checkbox" id="sound"><span></span></label></div>
<div class="row"><div data-i18n="autoClose"></div>
  <select id="autoCloseSec"><option value="10" data-i18n="s10"></option><option value="30" data-i18n="s30"></option><option value="60" data-i18n="s60"></option><option value="0" data-i18n="never"></option></select></div>

<h2 data-i18n="secUpdate"></h2>
<div class="row"><div data-i18n="updMode"></div>
  <select id="updateMode"><option value="notify" data-i18n="updModeNotify"></option><option value="popup" data-i18n="updModePopup"></option><option value="auto" data-i18n="updModeAuto"></option></select></div>
<div class="note" id="updModeNote" style="margin-top:6px"></div>
<div class="row"><div id="updStatus" class="note" style="margin:0"></div>
  <button type="button" class="btn tonal sm" id="updCheck" data-i18n="updCheck"></button></div>

<div class="actions">
  <button type="button" class="btn tonal" id="openSettings" data-i18n="openSettings"></button>
  <button type="button" class="btn tonal" id="openFolder" data-i18n="openFolder"></button>
  <button type="button" class="btn tonal danger" id="resetAll" data-i18n="resetAll"></button>
</div>
<a class="btn tonal coffee" href="https://ko-fi.com/cnvmp3" target="_blank" rel="noopener noreferrer" data-i18n="support"></a>
<div class="saved" id="saved"></div>
<script src="i18n.js"></script>
<script src="options.js"></script>
</body></html>
